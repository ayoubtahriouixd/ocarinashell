name: comprobaciones

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kit:
    name: kit (guardia, scripts, datos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias de las comprobaciones
        run: pip install --quiet pyflakes kdl-py
      - name: Hook de guardia (todas las pruebas)
        run: python3 scripts/hooks/test-guard.py
      - name: shellcheck
        run: shellcheck install.sh scripts/*.sh scripts/hooks/*.sh
      - name: Python sin errores (pyflakes)
        run: python3 -m pyflakes tools/*.py scripts/hooks/*.py
      - name: JSON válidos
        run: find . -name '*.json' -not -path './.git/*' -print0 | xargs -0 -n1 python3 -m json.tool > /dev/null
      - name: Atajos de niri (KDL)
        run: python3 -c "import kdl, sys; [kdl.parse(open(f).read()) for f in sys.argv[1:]]" reference/*.kdl
      - name: Datos reproducibles y contraste WCAG
        run: |
          python3 tools/build_data.py
          git diff --exit-code -- assets/data
          python3 tests/contraste.py

  instalador-arch:
    name: instalador en Arch (usuario normal, --demo)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Paquetes mínimos
        run: pacman -Syu --noconfirm --needed git python curl
      - uses: actions/checkout@v4
      - name: El recorrido completo sin cambiar nada, como un usuario sin privilegios
        run: |
          useradd -m prueba
          cp -a "$GITHUB_WORKSPACE" /home/prueba/ocarinashell
          chown -R prueba /home/prueba/ocarinashell
          su prueba -c "cd ~/ocarinashell && ./install.sh --demo --simple"
          su prueba -c "cd ~/ocarinashell && bash scripts/install.sh --dry-run >/dev/null"
      - name: Los paquetes de scripts/paquetes.txt existen en los repos de Arch (los de CachyOS se avisan)
        run: |
          missing=""
          for p in $(grep -v '^\s*#' scripts/paquetes.txt | grep -v '^\['); do
            pacman -Si "$p" >/dev/null 2>&1 || missing+="$p "
          done
          echo "::notice::fuera de los repos de Arch (CachyOS o AUR): ${missing:-ninguno}"
