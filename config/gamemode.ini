; OcarinaShell · GameMode (fase 11, D-060) — linked to ~/.config/gamemode.ini by scripts/install.sh.
; GameMode only tells 鬼 Oni that a game started or ended: Oni does the tuning (PPD performance, scx_lavd, GPU, fan…)
; and puts everything back exactly when the last game closes. So GameMode's own CPU governor switch is neutralised:
; on amd-pstate (active/EPP) «performance» would pin EPP and fight power-profiles-daemon, and on this APU it would
; pick «powersave» for the iGPU anyway. Keep every value here in sync with docs/JUEGOS.md.

[general]
; same governor as always (amd-pstate in active mode: «powersave» + EPP is the normal state, PPD sets the EPP)
desiredgov=powersave
defaultgov=powersave
igpu_desiredgov=powersave
; scx_lavd schedules by latency criticality: no renice / soft real-time on top of it
renice=0
softrealtime=off
inhibit_screensaver=1

; [gpu] is left out on purpose: GameMode refuses it in user files (and keeps it off by default); Oni sets the GPU
; level itself (measured: «high» is not faster than «auto» on the 860M)

[custom]
; /bin/sh -c: $HOME expands. Never fails a game launch (the CLI swallows errors when the shell is down).
start="$HOME/.local/bin/ocarina" oni auto-on
end="$HOME/.local/bin/ocarina" oni auto-off
script_timeout=5
