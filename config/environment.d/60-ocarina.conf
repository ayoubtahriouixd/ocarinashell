# OcarinaShell · environment for the systemd user manager (and so for every unit and D-Bus activated app).
# Same values as config/niri/ocarina/environment.kdl. The cursor theme is set by niri and gsettings (ocarina-theme).
QT_QPA_PLATFORMTHEME=qt6ct
QT_QPA_PLATFORM=wayland;xcb
ELECTRON_OZONE_PLATFORM_HINT=auto
# Steam (X11 through xwayland-satellite, which hands it native pixels: sharp but tiny at scale 1,75) — fase 11
STEAM_FORCE_DESKTOPUI_SCALING=1.75
