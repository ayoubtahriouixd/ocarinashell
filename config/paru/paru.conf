# ~/.config/paru/paru.conf — OcarinaShell (paru optimizado, D-005).
# Cada opción validada con `man paru.conf` de paru 2.1.0 (2026-10-14).
[options]
PgpFetch
Provides
BottomUp
SudoLoop
CombinedUpgrade
NewsOnUpgrade
BatchInstall
RemoveMake
CleanAfter
# Paquetes del AUR compilados → repo local /var/lib/repo/ocarina-aur (declarado en /etc/pacman.conf como
# [ocarina-aur]): reinstalar o bajar de versión sin recompilar.
LocalRepo = ocarina-aur
# Nada de -git para el núcleo del sistema (06-ACTUALIZACIONES): sin Devel.

[bin]
# Revisión de PKGBUILD con resaltado
Bat = bat
BatFlags = --style=plain --paging=always
