# OcarinaShell · yazi (phase 8). Images and PDFs preview inside Ghostty (kitty graphics protocol, detected by yazi).
[mgr]
ratio = [1, 3, 4]
sort_by = "natural"
sort_dir_first = true
show_hidden = false
show_symlink = true
linemode = "size"
scrolloff = 5

[preview]
wrap = "no"
tab_size = 4
# the panel is 2880×1800: big enough to be sharp, small enough to decode fast
max_width = 1400
max_height = 1800
image_filter = "lanczos3"
image_quality = 80
