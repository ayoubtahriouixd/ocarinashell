# ~/.config/pacman/makepkg.conf — OcarinaShell: compilación del AUR optimizada para Zen 5 (Ryzen AI 7 PRO 350).
# makepkg lo lee DESPUÉS de /etc/makepkg.conf (+ /etc/makepkg.conf.d/*): solo sobrescribe lo que hay aquí.
# Comparado con el /etc/makepkg.conf de CachyOS (2026-10-14): CachyOS ya usa -march=native -O3, el mismo
# endurecimiento (FORTIFY_SOURCE=3, stack-clash, CET), LDFLAGS con relro/now, LTO y RUSTFLAGS target-cpu=native
# (rust.conf). Por eso aquí NO se repiten CFLAGS/LDFLAGS: si CachyOS los mejora, los heredamos solos.
# Si un paquete falla con LTO o ccache, compílalo sin este fichero:
#   paru --mflags "--config /etc/../etc/makepkg.conf" <paquete>
# (ruta escrita distinta a propósito: makepkg solo se salta el fichero del usuario si --config NO es literalmente
# /etc/makepkg.conf; los drop-ins de /etc/makepkg.conf.d/ se siguen leyendo).

MAKEFLAGS="-j$(nproc)"
NINJAFLAGS="-j$(nproc)"

# Compilar en RAM (tmpfs, 32 GB) y con caché de compilación (~/.cache/ccache)
BUILDDIR=/tmp/makepkg
BUILDENV=(!distcc color ccache check !sign)
# Igual que CachyOS (incluido !autodeps) con LTO activado
OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug lto !autodeps)

# Compresión multihilo y rápida: los paquetes del AUR se guardan en el repo local (paru LocalRepo), no se publican
COMPRESSZST=(zstd -c -T0 -)
PKGEXT='.pkg.tar.zst'
