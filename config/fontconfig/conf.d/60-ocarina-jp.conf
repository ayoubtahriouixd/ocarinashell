<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- OcarinaShell: kanji always with Japanese glyph forms (形), never the Korean/Chinese ones.
     1) lang=ja → Noto CJK JP for the three generic families.
     2) No lang (most apps): the CJK fallback after the Latin font is JP, not whatever fontconfig sorts first.
     The shell itself names its fonts explicitly (Zen Kaku Gothic New, Shippori Mincho B1, Yuji Syuku). -->
<fontconfig>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK JP</string></edit>
  </match>

  <alias>
    <family>sans-serif</family>
    <prefer><family>Noto Sans</family><family>Noto Sans CJK JP</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Noto Serif</family><family>Noto Serif CJK JP</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Noto Sans Mono</family><family>Noto Sans Mono CJK JP</family></prefer>
  </alias>
</fontconfig>
