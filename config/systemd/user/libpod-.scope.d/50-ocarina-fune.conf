# 船 Fune: Podman puts each container in a transient libpod-<id>.scope. At logout or poweroff systemd stops it with
# SIGTERM and, after CachyOS' DefaultTimeoutStopSec=10s, SIGKILL — Windows would die halfway through the ACPI shutdown
# dockur starts on SIGTERM. Give it the time it needs (user@.service itself allows 2 min).
[Scope]
TimeoutStopSec=110s
