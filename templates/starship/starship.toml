# OcarinaShell · GENERATED by ocarina-theme from templates/starship/starship.toml — theme {{kanji}} {{name}}.
# Two lines like mockup 01:   ╭─ 寒露 ~/ocarinashell 枝 main 変2 新1 · 0.4s ············ 21:38
#                             ╰─❯
# The 節気 kanji comes from $OCARINA_SEKKI (bin/ocarina-daily, sourced by fish: no process per prompt). Git symbols:
# assets/data/kanji-ui.json → gitStatus. Budget: < 15 ms per prompt (`starship timings`).
"$schema" = "https://starship.rs/config-schema.json"
palette = "ocarina"
add_newline = true
scan_timeout = 20
command_timeout = 400
follow_symlinks = false

format = """
[╭─](bright-black)${env_var.OCARINA_SEKKI}$hostname$directory$git_branch$git_state$git_status$python$nix_shell$container\
$cmd_duration$status$jobs$fill$time
[╰─](bright-black)$character"""
continuation_prompt = "[  ┆ ](dim)"

[palettes.ocarina]
accent = "{{accent|hex}}"
accent_hover = "{{accentHover|hex}}"
accent2 = "{{accent2|hex}}"
text = "{{text|hex}}"
muted = "{{textMuted|hex}}"
dim = "{{textDim|hex}}"
success = "{{success|hex}}"
warning = "{{warning|hex}}"
error = "{{error|hex}}"
info = "{{info|hex}}"

[env_var.OCARINA_SEKKI]
format = " [$env_value](accent2)"

[directory]
format = " [$path]($style)[$read_only]($read_only_style)"
style = "bold accent"
read_only = " 錠"
read_only_style = "dim"
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = false
home_symbol = "~"

[git_branch]
format = " [on](bright-black) [$symbol$branch(:$remote_branch)]($style)"
symbol = "枝 "
style = "purple"                 # ANSI 5, like the mockup (.c5)
truncation_length = 28

[git_state]
format = " [$state( $progress_current/$progress_total)]($style)"
style = "warning"
rebase = "再基"
merge = "合流"
cherry_pick = "摘"
revert = "戻"
bisect = "二分"
am = "AM"

[git_status]
format = "([$all_status$ahead_behind]($style))"
style = "muted"
conflicted = " [衝${count}](error)"
ahead = " [先${count}](info)"
behind = " [後${count}](info)"
diverged = " [岐先${ahead_count}後${behind_count}](warning)"
untracked = " [新${count}](yellow)"
stashed = " 蔵${count}"
modified = " [変${count}](yellow)"
staged = " [済${count}](green)"
renamed = " 名${count}"
deleted = " [消${count}](error)"
up_to_date = ""
typechanged = ""
ignore_submodules = true

[cmd_duration]
format = " [· $duration]($style)"
style = "dim"
min_time = 400
show_milliseconds = true
show_notifications = false

[status]
# the last command failed: its code next to the duration (and the ❯ turns grey)
disabled = false
format = " [誤 $status]($style)"
style = "error"
map_symbol = false
recognize_signal_code = true

[jobs]
format = " [$symbol$number]($style)"
symbol = "業"
style = "accent2"
number_threshold = 1

[python]
format = " [$symbol$virtualenv]($style)"
symbol = "蛇 "
style = "info"
detect_extensions = []
detect_files = []

[nix_shell]
format = " [$symbol$state]($style)"
symbol = "雪 "
style = "info"

[container]
format = " [$symbol$name]($style)"
symbol = "箱 "
style = "dim"

[fill]
symbol = " "

[time]
disabled = false
format = "[$time]($style)"
time_format = "%H:%M"
style = "bright-black"

[character]
format = "$symbol "
success_symbol = "[❯](accent)"
error_symbol = "[❯](dim)"
vimcmd_symbol = "[❮](bold accent2)"

[username]
disabled = true

[hostname]
# only over SSH: the host in warning colour (Honban windows also get the red ring)
ssh_only = true
format = " [$ssh_symbol$hostname]($style)"
ssh_symbol = "遠 "
style = "bold warning"
