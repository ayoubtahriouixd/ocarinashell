# OcarinaShell · GENERATED by ocarina-theme from templates/mangohud/MangoHud.conf — theme {{kanji}} {{name}}.
# 鬼 MangoHud with the design (mockup 08): top-left, ink card, kanji labels in the accent — 速 FPS · 脳 CPU · 絵 GPU —
# values in white, frame-time graph in 鬼 gold (fixed, like the Oni hanko). Games are dark whatever the theme: only the
# accent follows it.
# Shift_R+F12 shows/hides it · Shift_L+F2 logs 60 s to ~/.local/state/ocarinashell/mangohud (docs/JUEGOS.md).
# Used by `ocarina play` (gamescope --mangoapp) and by MANGOHUD=1 / `mangohud %command%`.

legacy_layout=false
position=top-left
offset_x=18
offset_y=62
round_corners=9
background_color=080608
background_alpha=0.62
table_columns=3
width=330
hud_compact
no_small_font
font_size=22
font_file={{home}}/.local/share/fonts/ocarinashell/ZenKakuGothicNew-Bold.ttf
font_glyph_ranges=japanese
text_outline
text_outline_thickness=0.8
text_color=FFFFFF

fps
fps_text=速
frametime
frame_timing
frametime_color=e6b422
cpu_stats
cpu_text=脳
cpu_temp
cpu_color={{accent|nohash}}
gpu_stats
gpu_text=絵
gpu_temp
gpu_power
gpu_color={{accent|nohash}}
# RAM/VRAM left out: MangoHud cannot relabel them (Latin «RAM» next to the kanji); 速 脳 絵 電 are what matters
ram_color={{accent|nohash}}
vram_color={{accent|nohash}}
engine_color={{accent|nohash}}
wine_color={{accent|nohash}}
battery_color={{accent|nohash}}

toggle_hud=Shift_R+F12
toggle_logging=Shift_L+F2
log_duration=60
output_folder={{home}}/.local/state/ocarinashell/mangohud
