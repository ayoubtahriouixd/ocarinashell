# OcarinaShell · GENERATED by ocarina-theme from templates/lazygit/config.yml — theme {{kanji}} {{name}}.
# Edit the template (templates/lazygit/config.yml), not this file: every theme change rewrites it.
gui:
  nerdFontsVersion: "3"
  border: rounded
  showBottomLine: false
  showRandomTip: false
  showCommandLog: false
  timeFormat: "02 Jan 15:04"
  shortTimeFormat: "15:04"
  theme:
    activeBorderColor: ["{{accent|hex}}", bold]
    inactiveBorderColor: ["{{outline|hex}}"]
    searchingActiveBorderColor: ["{{accent2|hex}}", bold]
    optionsTextColor: ["{{accent2|hex}}"]
    selectedLineBgColor: ["{{surface2|hex}}"]
    inactiveViewSelectedLineBgColor: ["{{surface1|hex}}"]
    cherryPickedCommitFgColor: ["{{bg|hex}}"]
    cherryPickedCommitBgColor: ["{{accent2|hex}}"]
    markedBaseCommitFgColor: ["{{bg|hex}}"]
    markedBaseCommitBgColor: ["{{info|hex}}"]
    unstagedChangesColor: ["{{error|hex}}"]
    defaultFgColor: ["{{text|hex}}"]
git:
  autoFetch: false            # no background network (battery; Shinobi)
  parseEmoji: true
os:
  editPreset: nvim
notARepository: skip
promptToReturnFromSubprocess: false
