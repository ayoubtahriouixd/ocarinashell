# ~/.config/paru/paru.conf — OcarinaShell (paru optimizado). REFERENCIA: valida cada opción con `man paru.conf`
# de la versión instalada antes de usarla; si alguna no existe, quítala y anótalo en docs/DECISIONES.md.
[options]
PgpFetch
Provides
BottomUp
SudoLoop
CombinedUpgrade
NewsOnUpgrade
BatchInstall
RemoveMake
CleanAfter
# Guarda en un repo local los paquetes del AUR que compiles: reinstalar o bajar de versión sin recompilar
# (requiere crear el repo la primera vez; ver `man paru` → LocalRepo).
LocalRepo
# Nada de -git para el núcleo del sistema (06-ACTUALIZACIONES): sin Devel por defecto.
# Devel

[bin]
# Revisión de PKGBUILD con resaltado (si bat está instalado)
Bat = bat
BatFlags = --style=plain --paging=always
