# ~/.config/pacman/makepkg.conf — OcarinaShell: compilación del AUR optimizada para Zen 5 (Ryzen AI 7 PRO 350).
# makepkg ≥ pacman 6.1 lee este fichero DESPUÉS de /etc/makepkg.conf: solo sobrescribe lo que pongamos aquí.
# REFERENCIA: compáralo antes con el /etc/makepkg.conf de CachyOS (ya trae ajustes propios) y conserva sus flags de
# endurecimiento si difieren. Si un paquete concreto falla con -O3 o LTO, compílalo SIN este fichero con
#   paru --mflags "--config /etc/../etc/makepkg.conf" <paquete>
# (ruta escrita distinta a propósito: makepkg solo se salta el fichero del usuario si --config NO es literalmente
# /etc/makepkg.conf; los drop-ins de /etc/makepkg.conf.d/ de CachyOS se siguen leyendo).

CFLAGS="-march=native -mtune=native -O3 -pipe -fno-plt -fexceptions \
        -Wp,-D_FORTIFY_SOURCE=3 -Wformat -Werror=format-security \
        -fstack-clash-protection -fcf-protection"
CXXFLAGS="$CFLAGS -Wp,-D_GLIBCXX_ASSERTIONS"
RUSTFLAGS="-C opt-level=3 -C target-cpu=native"
MAKEFLAGS="-j$(nproc)"

# Compilar en RAM (32 GB de sobra) y con caché de compilación
BUILDDIR=/tmp/makepkg
BUILDENV=(!distcc color ccache check !sign)
OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug lto)

# Compresión multihilo
COMPRESSZST=(zstd -c -T0 -)
PKGEXT='.pkg.tar.zst'
