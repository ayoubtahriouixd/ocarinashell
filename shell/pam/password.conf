#%PAM-1.0
# Kagi (lock screen) · password. Read by Quickshell's PamContext from the user's own qs process (only `auth` works).
# Deliberately NOT `include system-local-login`: that pulls in system-auth's pam_faillock, and /run/faillock/<user> is
# user-writable, so three typos on the lock screen would lock the account for 10 min — the TTY rescue login too
# (docs/05-RESCATE). pam_unix keeps its fail delay; Kagi adds a growing wait after 3 failures (D-040).
auth required pam_unix.so
